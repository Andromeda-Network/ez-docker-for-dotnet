# Shared services every app on this server uses. Versions are pinned in docker/docker.env
# (see .env.example); bump them deliberately, after trying them on a test server.
services:

  nginx-pm:
    image: 'jc21/nginx-proxy-manager:${NGINX_PM_VERSION:-2.11.1}'
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # Admin UI on loopback only: reach it with `ssh -L 81:127.0.0.1:81 <server>`.
      - '127.0.0.1:${PORT_NGINX_PM:-81}:81'
    volumes:
      - ../shared/letsencrypt:/etc/letsencrypt
      - ../shared/nginx-pm:/data
      # add custom config in /data/nginx/custom
      # https://nginxproxymanager.com/advanced-config/#custom-nginx-configurations
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  portainer: #inner port :9443
    image: 'portainer/portainer-ce:${PORTAINER_VERSION:-2.19.4}'
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:${PORT_PORTAINER:-9443}:9443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../shared/portainer:/data


  # SQL Server (DB_ENGINE=mssql). Linux containers, amd64 hosts only. MSSQL_PID: Developer is free
  # but not licensed for production; use Express (free, limited) or your licensed edition there.
  mssql: #inner port :1433
    image: 'mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2022-latest}'
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ../shared/mssql:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s


  # PostgreSQL (DB_ENGINE=postgres).
  postgres: #inner port :5432
    image: 'postgres:${POSTGRES_VERSION:-17.2-alpine}'
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../shared/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis: #inner port :6379
    image: 'redis:${REDIS_VERSION:-7.4.1-alpine}'
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ../shared/redis:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5


  # Structured logs and errors from every app (apps send to http://seq:5341).
  # UI on loopback only: `ssh -L 5380:127.0.0.1:5380 <server>`, then http://localhost:5380.
  seq: #inner port :80 (UI), :5341 (ingestion)
    image: 'datalust/seq:${SEQ_VERSION:-2024.3}'
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - '127.0.0.1:${PORT_SEQ:-5380}:80'
    volumes:
      - ../shared/seq:/data
