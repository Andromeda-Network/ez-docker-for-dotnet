# Started by `ez shared deploy`: nginx-pm and redis always; the database from DB_ENGINE and the
# optional services from SHARED_PROFILES (both in docker/docker.env).
services:

  nginx-pm:
    container_name: nginx-pm
    extends:
      file: common-shared.yml
      service: nginx-pm

  redis:
    container_name: redis
    extends:
      file: common-shared.yml
      service: redis

  mssql:
    container_name: mssql
    extends:
      file: common-shared.yml
      service: mssql
    profiles: [ mssql ]

  postgres:
    container_name: postgres
    extends:
      file: common-shared.yml
      service: postgres
    profiles: [ postgres ]

  seq:
    container_name: seq
    extends:
      file: common-shared.yml
      service: seq
    profiles: [ seq ]

  portainer:
    container_name: portainer
    extends:
      file: common-shared.yml
      service: portainer
    profiles: [ portainer ]

networks:
  default:
    external: true
    name: ${SHARED_NETWORK_NAME}
