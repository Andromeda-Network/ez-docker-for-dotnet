# Image mode: run the image CI built, tested and pushed (APP_IMAGE, its tag chosen by
# `ez dotnet deploy --tag`). This host needs only a registry pull: no source, SDK or build.
#
# Covers the deployed environments only: dev runs live source and test builds the tree it is
# about to test.
services:

  dotnet-staging:
    container_name: ${APP_NAME}_staging
    image: ${APP_IMAGE}
    extends:
      file: common-dotnet.yml
      service: dotnet-runtime
    volumes:
      - ./storage-staging:/app/data
    profiles:
      - staging

  dotnet-production:
    container_name: ${APP_NAME}_production
    image: ${APP_IMAGE}
    extends:
      file: common-dotnet.yml
      service: dotnet-runtime
    volumes:
      - ./storage-production:/app/data
    profiles:
      - production

  migrate:
    image: ${MIGRATIONS_IMAGE}
    extends:
      file: common-dotnet.yml
      service: migrations
    profiles:
      - migrate


networks:
  default:
    external: true
    name: ${SHARED_NETWORK_NAME}
