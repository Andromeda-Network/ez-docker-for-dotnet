# Build mode: built on this host from apps/<app>/src-<env> (a checkout of GIT_URL/GIT_BRANCH).
services:

  # dev: live source with `dotnet watch` (edit apps/<app>/src-dev, it rebuilds), on APP_PORT.
  dotnet-dev:
    container_name: ${APP_NAME}_dev
    image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION:-10.0}
    working_dir: /src
    user: "${OWNER_USER_ID}:${OWNER_GROUP_ID}"
    command: [ "dotnet", "watch", "run", "--project", "${PROJECT}", "--no-launch-profile" ]
    env_file:
      - ./env/generated/${APP_ENV}.env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - DOTNET_CLI_HOME=/tmp
      - NUGET_PACKAGES=/tmp/nuget
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    restart: unless-stopped
    ports:
      - ${APP_PORT}:8080
    volumes:
      - ./src-dev:/src
    profiles:
      - dev

  dotnet-test:
    container_name: ${APP_NAME}_test
    extends:
      file: common-dotnet.yml
      service: dotnet
    build:
      context: ./src-test
    image: ${APP_NAME}:test
    ports:
      - ${APP_PORT}:8080
    volumes:
      - ./storage-test:/app/data
    profiles:
      - test

  dotnet-staging:
    container_name: ${APP_NAME}_staging
    extends:
      file: common-dotnet.yml
      service: dotnet
    build:
      context: ./src-staging
    image: ${APP_NAME}:staging
    volumes:
      - ./storage-staging:/app/data
    profiles:
      - staging

  dotnet-production:
    container_name: ${APP_NAME}_production
    extends:
      file: common-dotnet.yml
      service: dotnet
    build:
      context: ./src-production
    image: ${APP_NAME}:production
    volumes:
      - ./storage-production:/app/data
    profiles:
      - production

  migrate:
    extends:
      file: common-dotnet.yml
      service: migrations
    build:
      context: ./src-${APP_ENV}
      dockerfile: ../dotnet.Dockerfile
      target: migrations
      args:
        - PROJECT=${PROJECT}
        - EF_PROJECT=${EF_PROJECT:-}
        - DOTNET_VERSION=${DOTNET_VERSION:-10.0}
    image: ${APP_NAME}-migrations:${APP_ENV}
    profiles:
      - migrate


networks:
  default:
    external: true
    name: ${SHARED_NETWORK_NAME}
