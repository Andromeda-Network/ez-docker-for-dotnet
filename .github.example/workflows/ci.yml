# Copy to your app repository's .github/workflows/, and template/dotnet.Dockerfile to its root.
# Builds and tests every push and pull request, and checks that the Docker image builds.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging, test]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dotnet.Dockerfile
          build-args: PROJECT=${{ vars.PROJECT }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
