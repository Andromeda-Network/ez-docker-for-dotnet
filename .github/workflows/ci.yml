# Checks this tool: `ez` matches its source, passes shellcheck and its flow tests, and the .NET
# template builds and runs the example app.
name: CI

on:
  push:
  pull_request:

jobs:
  ez:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: ez is generated from src/ (bashly 1.3.8)
        run: |
          gem install bashly -v 1.3.8 --no-document
          cp ez /tmp/ez.committed
          bashly generate >/dev/null
          diff -u /tmp/ez.committed ez || { echo "::error::ez is out of date: run 'bashly generate' and commit it"; exit 1; }
      - name: shellcheck
        run: shellcheck -S warning ez tests/run.sh tests/stub/docker
      - name: Flow tests (stub docker)
        run: EZ_TEST_OUT=$RUNNER_TEMP/generated bash tests/run.sh
      - name: The compose files ez generated are valid
        run: |
          set -e
          ls "$RUNNER_TEMP/generated"
          for f in "$RUNNER_TEMP"/generated/*.yml; do
            echo "== $f"
            override=$(dirname "$(grep -m1 'env_file' "$f" | sed 's/.*\[ "\(.*\)" \].*/\1/')")/../../compose.override.yml
            if [[ -f "$override" ]]; then
              docker compose -f "$f" -f "$override" --profile migrate config --quiet
            else
              docker compose -f "$f" --profile migrate config --quiet
            fi
          done

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test example/Example.slnx -c Release
      - name: Build the example with template/dotnet.Dockerfile
        run: |
          set -e
          cp template/.dockerignore example/.dockerignore
          args="--build-arg PROJECT=src/Example.Api/Example.Api.csproj -f template/dotnet.Dockerfile example"
          docker build --target test $args
          docker build -t example:ci $args
      - name: The container is healthy, non-root, in Iran time
        run: |
          set -e
          docker run -d --name example -p 8080:8080 example:ci
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' example)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' example | grep -qx healthy
          curl -fsS http://localhost:8080/healthz | grep -qx Healthy
          test "$(docker exec example id -u)" != 0
          test "$(docker exec example date +%z)" = "+0330"
      - name: Shared compose file is valid
        run: |
          export SHARED_NETWORK_NAME=ez MSSQL_SA_PASSWORD=x REDIS_PASSWORD=x POSTGRES_PASSWORD=x SEQ_ADMIN_PASSWORD=x
          docker compose -f docker/compose-shared.yml --profile mssql --profile postgres --profile seq --profile portainer config --quiet
      - if: always()
        run: docker logs example || true
